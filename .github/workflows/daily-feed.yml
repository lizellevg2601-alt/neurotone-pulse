name: Daily Feed Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate:feed

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily feed data update"
          file_pattern: public/feed-data.json

      - name: Build and Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3974c9f555d3c107ece3f4f48defb23
        run: |
          npm run build
          npx wrangler deploy --name neurotone-pulse2 --compatibility-date 2026-07-26 --assets out/
